# =============================================
#           EndlessCoinflip by ItsNotSkyeX
#   General chat messages. Use & colour codes.
#   Placeholders shown in {}.
#
#   GUI-specific text (titles, item names, lore)
#   lives in config.yml instead — this file is
#   just chat messages.
# =============================================

no-permission: "&c&l(!) &cYou don't have permission to do that."
player-only: "&c&l(!) &cOnly players can use this command."
invalid-amount: "&c&l(!) &cInvalid amount. Please enter a number."
wager-must-be-positive: "&c&l(!) &cWager must be a positive number."
wager-too-low: "&c&l(!) &cThe minimum wager is &7{min}&c."
wager-too-high: "&c&l(!) &cThe maximum wager is &7{max}&c."
feature-disabled: "&c&l(!) &cThat feature is currently disabled."

insufficient-funds-create: "&c&l(!) &cYou don't have enough money to create that match."
insufficient-funds-join: "&c&l(!) &cYou don't have enough money to join that match."
insufficient-funds-need: "&c&l(!) &cYou need &7{wager} &cto place that wager."
already-has-match: "&c&l(!) &cYou already have an active match. Cancel it first with &7/cf cancel&c."
lobby-full: "&c&l(!) &cThe coinflip lobby is full. Try again later."
match-created: "&a&l(!) &aMatch created for &f{wager}&a! Waiting for an opponent..."
match-cancelled: "&a&l(!) &aYour match has been cancelled and your wager refunded."
no-active-match: "&c&l(!) &cYou don't have an active match to cancel."
match-no-longer-exists: "&c&l(!) &cThat match no longer exists."
match-expired: "&c&l(!) &cYour match expired with no opponent and your wager of &7{wager} &cwas refunded."
cooldown-active: "&c&l(!) &cYou must wait &7{time}s &cbefore playing again."

you-won: "&a&l[!] &aYou won &f{wager} &aagainst &f{opponent}&a!"
you-lost: "&c&l[!] &cYou lost &f{wager} &cto &f{opponent}&c."

bot-battle-prompt: "&a&l(!) &aEnter a wager amount in chat, or type &7cancel&a."
bot-battle-cancelled: "&a&l(!) &aBot battle cancelled."
bot-battle-invalid-amount: "&c&l(!) &cInvalid amount entered."

pending-payout: "&a&l[!] &aYou received a pending coinflip payout of &f{amount}&a!"

reload-success: "&a&l(!) &aConfig reloaded successfully."
reload-failed: "&c&l(!) &cConfig failed to reload — check console for a YAML error. Your previous settings are still active."

help-cmd-main: "&b/cf &f— Open the coinflip menu"
help-cmd-wager: "&b/cf &f<wager|all|half> &f— Create a match"
help-cmd-bot: "&b/cf bot &f<wager> &f— Start a bot battle instantly"
help-cmd-cancel: "&b/cf cancel &f— Cancel your active match"
help-cmd-stats: "&b/cf stats &f— View your coinflip stats"
help-cmd-history: "&b/cf history &f— View your match history"
help-cmd-top: "&b/cf top &f<page> &f— View the leaderboard"

help:
  - "&0&m                                        "
  - "  &b&lEndlessCoinflip &8— &7Commands"
  - "&0&m                                        "
  - "  &b/cf &8— &7Open the coinflip lobby"
  - "  &b/cf <amount> &8— &7Create a match (supports all, half, 10k, 1m, etc.)"
  - "  &b/cf bot <amount> &8— &7Start a bot battle instantly"
  - "  &b/cf cancel &8— &7Cancel your active match"
  - "  &b/cf stats &8— &7View your coinflip statistics"
  - "  &b/cf history &8— &7View your match history"
  - "  &b/cf top <page> &8— &7View the leaderboard"
  - "  &b/cf help &8— &7Show this help menu"
  - "  &b/cf reload &8— &7Reload config (admin)"
  - "&0&m                                        "

stats:
  - "&0&m                                        "
  - "  &b&lYour Coinflip Stats"
  - "&0&m                                        "
  - "  &7Wins&8: &f{wins}"
  - "  &7Losses&8: &f{losses}"
  - "  &7Total Wagered&8: &f{wagered}"
  - "  &7Total Won&8: &f{won}"
  - "  &7Biggest Win&8: &f{win}"
  - "  &7Biggest Loss&8: &f{loss}"
  - "&0&m                                        "
